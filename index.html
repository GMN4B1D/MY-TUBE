<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Full Quality Downloader</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #0f0f0f; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { background: #1a1a1a; border-radius: 16px; padding: 32px; max-width: 520px; width: 100%; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
    h1 { font-size: 1.6rem; margin-bottom: 8px; }
    p { color: #aaa; margin-bottom: 24px; font-size: 0.95rem; }
    input { width: 100%; padding: 14px 16px; border-radius: 10px; border: 1px solid #333; background: #111; color: #fff; font-size: 1rem; margin-bottom: 16px; }
    button { width: 100%; padding: 14px; border: none; border-radius: 10px; background: #ff0000; color: white; font-size: 1rem; font-weight: 600; cursor: pointer; }
    button:hover { background: #cc0000; }
    .note { margin-top: 20px; font-size: 0.85rem; color: #888; line-height: 1.5; }
    a { color: #4ea1ff; }
  </style>
</head>
<body>
  <div class="card">
    <h1>YouTube Full Quality Downloader</h1>
    <p>যেকোনো YouTube লিংক দাও → ফুল কোয়ালিটি ডাউনলোড অপশন পাবে</p>
    
    <input type="text" id="url" placeholder="https://www.youtube.com/watch?v=...">
    <button onclick="download()">ডাউনলোড করো</button>

    <div class="note">
      এটা <a href="https://github.com/imputnet/cobalt" target="_blank">Cobalt</a> API ব্যবহার করে।  
      সবসময় ফ্রি পাবলিক ইনস্ট্যান্স কাজ নাও করতে পারে।  
      সবচেয়ে ভালো রেজাল্টের জন্য নিজের সার্ভারে Cobalt চালাও।
    </div>
  </div>

  <script>
    function download() {
      const url = document.getElementById('url').value.trim();
      if (!url) {
        alert('লিংক দাও');
        return;
      }
      // Cobalt public instance ব্যবহার
      const api = 'https://api.cobalt.tools/api/json';
      
      fetch(api, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Accept': 'application/json'
        },
        body: JSON.stringify({
          url: url,
          vCodec: 'h264',
          vQuality: 'max',     // সর্বোচ্চ কোয়ালিটি
          aFormat: 'mp3',
          isAudioOnly: false,
          filenamePattern: 'basic'
        })
      })
      .then(r => r.json())
      .then(data => {
        if (data.status === 'redirect' || data.status === 'stream') {
          window.open(data.url, '_blank');
        } else if (data.status === 'picker') {
          // একাধিক অপশন থাকলে প্রথমটা
          window.open(data.picker[0].url, '_blank');
        } else {
          alert('এরর: ' + (data.text || 'কিছু ভুল হয়েছে'));
        }
      })
      .catch(err => {
        alert('API কাজ করছে না। অন্য ইনস্ট্যান্স চেষ্টা করো বা নিজের Cobalt সার্ভার চালাও।');
        console.error(err);
      });
    }
  </script>
</body>
</html>
